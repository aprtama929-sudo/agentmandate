[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# BNB Smart Chain mainnet (chain ID 56)
[rpc_endpoints]
bsc = "https://bsc-rpc.publicnode.com"

# Source verification (rules require BscScan; Sourcify is the fallback):
#   BscScan:  forge verify-contract --chain-id 56 --verifier bscscan <ADDR> src/<File>.sol:<Name>
#   Sourcify: forge verify-contract --chain-id 56 --verifier sourcify <ADDR> src/<File>.sol:<Name>
